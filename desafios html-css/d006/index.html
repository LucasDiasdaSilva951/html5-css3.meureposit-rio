<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 6</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse <br>sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <li><p><abbr title="Use a tag <p>">Parágrafo</abbr></p></li>
        <li><p><abbr title="Use as tags <h1, h2, h3, h4, h5 e h6>(Hierarquia de Títulos)">Títulos</abbr></p></li>
        <li><p><abbr title="Use a tag <img>">Imagens</abbr></p></li>
        <li><p><abbr title="Use a tag <abbr>">Abreviações</abbr></p></li>
        <li><p><abbr title="Use a tag <code>">Códigos-fonte</abbr></p></li>
        <li><p><abbr title="Use a tag <ol> (Listas Ordenadas)">Listas numeradas</abbr></p></li>
        <li><p><abbr title="Use a tag <ul> (Listas não Ordenadas)">Listas com demarcadores</abbr></p></li>
    </ul>
</body>
</html>
